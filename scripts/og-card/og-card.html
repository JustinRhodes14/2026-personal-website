<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #030712;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image:
      linear-gradient(#8b5cf6 1px, transparent 1px),
      linear-gradient(90deg, #8b5cf6 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .blob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, rgba(139,92,246,0.08) 45%, transparent 70%);
    filter: blur(10px);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .monogram {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    background: #0b0f1a;
    border: 2px solid rgba(139, 92, 246, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 40px;
    background-image: linear-gradient(135deg, #a78bfa, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 32px;
    box-shadow: 0 0 60px rgba(139, 92, 246, 0.25);
  }

  h1 {
    font-size: 68px;
    font-weight: 800;
    background-image: linear-gradient(90deg, #a78bfa, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }

  h2 {
    font-size: 30px;
    font-weight: 500;
    color: #d1d5db;
    margin-bottom: 28px;
  }

  .tags {
    display: flex;
    gap: 14px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #c4b5fd;
    border: 1px solid rgba(139, 92, 246, 0.35);
    background: rgba(139, 92, 246, 0.08);
    padding: 8px 18px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid-overlay"></div>
    <div class="blob"></div>
    <div class="content">
      <div class="monogram">JR</div>
      <h1>Justin Rhodes</h1>
      <h2>Senior Application Developer</h2>
      <div class="tags">
        <span class="tag">Full-Stack</span>
        <span class="tag">Databases</span>
        <span class="tag">DevOps</span>
      </div>
    </div>
  </div>
</body>
</html>
